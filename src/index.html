<title>Morrow Recovery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail on desktop / bottom tab bar on phone; one calm column of instrument-like readouts per view. Dark-first. */
:root{
  --bg:#090B0E; --surface:#11151A; --surface-2:#181E25; --line:#232B34; --fg:#ECF1F4; --muted:#87939F; --faint:#55606B;
  --accent:#A9D3E6; --accent-ink:#071017; --accent-soft:rgba(169,211,230,.12);
  --good:#45C98A; --warn:#E6B24A; --bad:#E7624F;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Geist",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-lg:22px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D9E0E6; --fg:#0D1216; --muted:#5B6670; --faint:#8E99A3;
  --accent:#23688A; --accent-ink:#FFFFFF; --accent-soft:rgba(35,104,138,.10);
  --good:#178F57; --warn:#A97810; --bad:#C2412D; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D9E0E6; --fg:#0D1216; --muted:#5B6670; --faint:#8E99A3;
  --accent:#23688A; --accent-ink:#FFFFFF; --accent-soft:rgba(35,104,138,.10);
  --good:#178F57; --warn:#A97810; --bad:#C2412D; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-display);font-stretch:125%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}
.brand b{font:700 17px var(--f-display);font-stretch:125%;letter-spacing:.06em}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);position:relative}
.mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.rail .who{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface);font-size:13px}
main{min-width:0;padding-block:32px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:clamp(26px,4vw,34px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font:500 12px var(--f-mono);letter-spacing:.04em;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel h2{font-size:17px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2{grid-template-columns:minmax(0,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;padding:11px 20px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0}

/* hero readiness */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.ring{position:relative;width:230px;height:230px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .center .num{font-size:64px;font-weight:700;line-height:1}
.ring-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.verdict h2{font-size:clamp(24px,3.4vw,30px);margin-top:8px}
.verdict p{max-width:60ch;color:var(--muted);margin:10px 0 0}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:22px}
@media (max-width:720px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vital{background:var(--surface-2);padding:14px 16px;text-align:left}
.vital .num{font-size:26px;font-weight:600}
.vital .unit{font:500 12px var(--f-mono);color:var(--muted);margin-left:3px}
.delta{font:500 12px var(--f-mono)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

.stat .num{font-size:30px;font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.fig{width:64px;height:52px;flex:none;border-radius:12px;background:var(--surface-2);border:0;padding:0;display:block}
.fig svg{width:100%;height:100%;display:block}
.figbig{width:100%;max-width:440px;aspect-ratio:120/96;background:var(--surface-2);border-radius:18px;margin:0 auto;border:0;padding:0;display:block}
.figbig svg{width:100%;height:100%;display:block}
@media (max-width:560px){.row .timer{display:none}.fig{width:58px;height:47px}}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);background:none;flex:none;display:grid;place-items:center;margin-top:1px}
.tick svg{width:14px;height:14px;opacity:0}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tick[aria-pressed="true"] svg{opacity:1;color:var(--bg)}
.row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font:500 11px var(--f-mono);letter-spacing:.04em;color:var(--muted);padding:3px 7px;border-radius:6px;background:var(--surface-2)}
.tag.warn{color:var(--warn)}
.timer{font:500 12px var(--f-mono);border:1px solid var(--line);background:none;border-radius:99px;padding:5px 10px;color:var(--muted);flex:none}
.timer.on{color:var(--accent);border-color:var(--accent)}

.note{border-left:3px solid var(--accent);padding:10px 14px;background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:99px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}

/* hydration */
.water{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.water{grid-template-columns:minmax(0,1fr);justify-items:center}}
.vessel{width:130px;height:200px;border-radius:26px 26px 40px 40px;border:2px solid var(--line);position:relative;overflow:hidden;background:var(--surface-2)}
.vessel .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,transparent),var(--accent));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vessel .lvl{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}
.vessel .lvl .num{font-size:26px;font-weight:700}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.bottles{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bottle{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 8px 8px;min-width:72px;color:var(--fg)}
.bottle:hover{border-color:var(--accent)}
.bottle svg{width:60px;height:120px;overflow:visible}
.bottles.small .bottle{min-width:56px;padding:6px 6px 6px}
.bottles.small .bottle svg{width:36px;height:72px}
.bottle span{font-size:12px}
.bwater{transform-box:fill-box;transform-origin:50% 100%}
.bottle.pour svg{animation:tilt 1.1s ease-in-out}
.bottle.pour .bwater{animation:drain 1.1s ease-in forwards}
@keyframes tilt{0%{transform:rotate(0)}25%,70%{transform:rotate(-28deg) translateY(-4px)}100%{transform:rotate(0)}}
@keyframes drain{0%,20%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}
.vessel .splash{position:absolute;left:50%;top:18%;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--accent);animation:splash 1s ease-out forwards;z-index:2}
@keyframes splash{0%{transform:scale(.3);opacity:1}100%{transform:scale(5);opacity:0}}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.steps li{padding-left:4px}
.linkrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.linkrow .input{flex:1;min-width:0;font-size:13px}
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);position:relative;flex:none;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(18px);background:var(--accent-ink)}
.wakegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* coach */
.chat{display:flex;flex-direction:column;gap:14px;min-height:320px}
.msg{max-width:min(680px,92%);padding:12px 16px;border-radius:18px;line-height:1.55;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul{margin:4px 0 8px;padding-left:18px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);padding:12px 14px;min-height:48px;max-height:140px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 12px;font-size:13px;color:var(--muted)}
.suggest button:hover{color:var(--fg);border-color:var(--faint)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.pair{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.days button{width:48px;padding:9px 0;text-align:center}
.choice{display:grid;gap:10px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px}
.choice button b{font-family:var(--f-display);font-stretch:110%;font-weight:600}
.choice button span{font-size:13px;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.sports button{aspect-ratio:1.25;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
.sports button svg{width:30px;height:30px;color:var(--muted)}
.sports button b{font-family:var(--f-display);font-stretch:112%;font-weight:600;font-size:15px}
.sports button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sports button[aria-pressed="true"] svg{color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font:600 22px var(--f-display);font-stretch:120%}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ob-top{max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px}
.progress{flex:1;height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.ob-body{max-width:720px;width:100%;margin:40px auto 0;display:flex;flex-direction:column;gap:26px;flex:1}
.ob-body h1{font-size:clamp(28px,5vw,40px);line-height:1.08}
.ob-body .lead{color:var(--muted);max-width:56ch;margin:10px 0 0;font-size:16px}
.ob-foot{max-width:720px;width:100%;margin:36px auto 0;display:flex;justify-content:space-between;gap:12px}
.ob-section{display:flex;flex-direction:column;gap:12px}
.welcome{max-width:1040px;margin:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;width:100%}
@media (max-width:820px){.welcome{grid-template-columns:minmax(0,1fr);gap:28px}}
.welcome h1{font-size:clamp(38px,7vw,68px);line-height:.98;font-stretch:125%;font-weight:700}
.welcome .lead{font-size:17px;color:var(--muted);max-width:46ch;margin:18px 0 28px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:18px}
.points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:34px}
@media (max-width:560px){.points{grid-template-columns:minmax(0,1fr)}}
.points div{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;color:var(--muted)}
.points b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}
.injrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:700px){.sheet{border-radius:24px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;display:inline-grid;place-items:center;padding:0;flex:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 0;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}

.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--accent-soft);font-size:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60}
.wear{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.wear:first-child{border-top:0}
.wlogo{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font:700 13px var(--f-display);font-stretch:120%;flex:none}

/* mobile nav */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30}
  .rail .brand,.rail .who{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;flex:1;align-items:center}
  .nav button[aria-current="page"]{background:none;color:var(--accent)}
  main{padding-block:22px 110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
/* ============================== DATA ============================== */
const SPORTS={

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>keyOf(new Date());
const dow=d=>(d.getDay()+6)%7; // Mon=0
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const parseT=t=>{const[h,m]=(t||'22:30').split(':').map(Number);return h*60+m};
const fmtT=min=>{min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),m=min%60;const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const fmtH=h=>{const t=Math.round(h*60);return `${Math.floor(t/60)}h ${pad(t%60)}m`};
const zoneOf=s=>s>=67?'good':s>=34?'warn':'bad';

function persist(){
  S.updatedAt=Date.now();
  if(S.profile?.sample) return; // sample athlete never saved
  try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    if(store.mode!=='cloud')return;
    const body=JSON.parse(JSON.stringify({profile:S.profile,days:pruneDays(S.days),units:S.units,updatedAt:S.updatedAt}));
    store.chain=store.chain.then(()=>store.ref.set(body)).catch(()=>{});
  },900);
}
function pruneDays(days){const keys=Object.keys(days).sort().slice(-180);const o={};keys.forEach(k=>o[k]=days[k]);return o}
async function initCloud(){
  try{
    if(!window.claude?.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);

/* ============================== MODEL ============================== */
function focusRegions(p){
  const w={};const add=(o,m=1)=>{for(const k in o)w[k]=(w[k]||0)+o[k]*m};
  add(SPORTS[p.sport]?.r||SPORTS.other.r);
  (p.positions||[]).forEach(pos=>POSMOD.forEach(([re,o])=>{if(re.test(pos))add(o)}));
  (p.mobility||[]).forEach(m=>{const f=MOBILITY.find(x=>x[0]===m);if(f)w[f[1]]=(w[f[1]]||0)+1.5});
  (p.injuries||[]).forEach(i=>{const f=INJ.find(x=>x.k===i.area);if(f?.r&&i.status!=='active')w[f.r]=(w[f.r]||0)+1.5});
  return Object.entries(w).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v}));
}
const rpeOf=p=>[4,5,6.5,7.5,8.5][(p.intensity??2)];
function plannedLoad(p,date){
  const d=dow(date);
  if((p.compDays||[]).includes(d)&&p.phase!=='Off-season')return{type:'competition',min:Math.round((p.duration||90)*1.1),rpe:9};
  if((p.practiceDays||[]).includes(d))return{type:'training',min:p.duration||90,rpe:rpeOf(p)};
  return{type:'rest',min:0,rpe:0};
}
function dayType(p,date){
  const t=plannedLoad(p,date).type;
  if(t==='competition')return'competition';
  const tom=plannedLoad(p,addDays(date,1)).type, yest=plannedLoad(p,addDays(date,-1)).type;
  const nc=p.nextComp?new Date(p.nextComp+'T12:00'):null;
  if(nc&&keyOf(nc)===keyOf(addDays(date,1)))return'pre';
  if(nc&&keyOf(nc)===keyOf(date))return'competition';
  if(tom==='competition'&&p.phase!=='Off-season')return'pre';
  if(yest==='competition'&&p.phase!=='Off-season')return'post';
  return t;
}
const DAYTYPE_N={competition:'Competition day',pre:'Day before competition',post:'Day after competition',training:'Training day',rest:'Recovery day'};

/* ============================== SLEEP SETTINGS ============================== */
const DEFAULT_ROUTINE=[
 {id:'meal',text:'Finish your last big meal',before:120,on:true},
 {id:'screens',text:'Screens off, lights dim and warm',before:60,on:true},
 {id:'shower',text:'Warm shower or bath',before:60,on:true},
 {id:'stretch',text:'Night stretch routine',before:45,on:true},
 {id:'room',text:'Bedroom cool (60–67 °F), dark and quiet',before:30,on:true},
 {id:'breathe',text:'Breathwork or reading in bed',before:10,on:true}
];
function sleepCfg(p){
  const c={goalMode:'auto',goalH:8.5,wakeMode:'same',wakeDays:Array(7).fill(p.wake||'06:45'),latency:15,loadAdj:true,debtAdj:true,caffeine:'14:00',caffeineOn:true,temp:65,routine:DEFAULT_ROUTINE,...(p.sleep||{}),loadAdj:true,debtAdj:true};
  return c;
}
function autoNeed(p){const a=p.age||22;return a<18?9:a<=25?8.5:8}
function sleepNeed(p){const c=sleepCfg(p);return c.goalMode==='custom'?+c.goalH:autoNeed(p)}
const usualSleep=p=>Math.max(4,((parseT(p.wake)-parseT(p.bed)+1440)%1440)/60-.33);
function wakeFor(p,date){const c=sleepCfg(p);return c.wakeMode==='perday'?c.wakeDays[dow(date)]:p.wake}
const tempStr=f=>metric()?`${Math.round((f-32)/1.8)} °C`:`${f} °F`;

/* Last 42 days from what the athlete logs. Past sessions that weren't logged are estimated from the training schedule. */
function buildSeries(p,N=42){
  const need=sleepNeed(p);
  const out=[];const today=new Date();today.setHours(12,0,0,0);
  for(let i=N-1;i>=0;i--){
    const date=addDays(today,-i),k=keyOf(date),log=S.days[k]||{};
    const pl=plannedLoad(p,date);
    let sess=log.session?{...log.session}:null,est=false;
    if(!sess&&i>0&&pl.min){sess={min:pl.min,rpe:Math.round(pl.rpe)};est=true}
    const ck=log.checkin||null;
    out.push({k,date,planned:pl,sess,est,load:sess?sess.min*sess.rpe:0,checkin:ck,sleepH:ck?+ck.sleepH:null,nap:log.nap||0,done:log.done||[],water:log.water||0});
  }
  out.forEach((d,i)=>{
    const w7=out.slice(Math.max(0,i-6),i+1).map(x=>x.load),w28=out.slice(Math.max(0,i-27),i+1).map(x=>x.load);
    d.acute=mean(w7);d.chronic=mean(w28);d.acwr=d.chronic>0?d.acute/d.chronic:1;
    d.debt=out.slice(Math.max(0,i-6),i+1).reduce((a,x)=>a+(x.sleepH!=null?Math.max(0,need-x.sleepH-x.nap/60):0),0);
    d.sleepPerf=d.sleepH!=null?Math.round(clamp(d.sleepH/need,0,1)*100):null;
    const c=d.checkin;
    if(!c){d.recovery=null;return}
    const prev=out[i-1]||d;
    const sp=clamp(d.sleepH/need,0,1);
    const f=x=>(x-1)/4;
    let s=.34*Math.pow(sp,1.4)+.14*f(c.quality||3)+.2*(1-f(c.soreness||3))+.17*f(c.energy||3)+.15*(1-f(c.stress||3));
    let pen=clamp((prev.acwr-1.25)*30,0,14);
    if(prev.chronic>0)pen+=clamp((prev.load/prev.chronic-1.6)*6,0,8);
    d.recovery=Math.round(clamp(100*s-pen,3,99));
    d.penalty=Math.round(pen);
  });
  return out;
}

/* What works for you: change in next-morning recovery after each method */
function learnEffects(series){
  const by={};
  for(let i=0;i<series.length-1;i++){
    const d=series[i],n=series[i+1];if(!d.done.length||d.recovery==null||n.recovery==null)continue;
    const tags=new Set(d.done.map(id=>LIB.find(x=>x.id===id)?.tag).filter(Boolean));
    const delta=n.recovery-d.recovery;
    tags.forEach(t=>{(by[t]=by[t]||[]).push(delta)});
  }
  return Object.entries(by).map(([t,a])=>({t,n:a.length,avg:mean(a)})).sort((a,b)=>b.avg-a.avg);
}

const TAG_N={cold:'Cold exposure',heat:'Heat',compression:'Compression',soft:'Soft tissue',mobility:'Mobility work',breath:'Breathwork & NSDR',pool:'Pool work',active:'Active recovery'};

function buildPlan(p,today,series){
  const dt=dayType(p,new Date());
  const zone=today.recovery==null?'warn':zoneOf(today.recovery);
  const regions=focusRegions(p);
  (today.checkin?.sore||[]).forEach(r=>{const f=regions.find(x=>x.k===r);if(f)f.v+=4;else regions.push({k:r,v:4})});
  regions.sort((a,b)=>b.v-a.v);
  const focus=regions.slice(0,4).map(r=>r.k);
  const eq=new Set(p.equipment||[]);
  const activeInj=(p.injuries||[]).filter(i=>i.status==='active').map(i=>i.area);
  const prefs=new Set(p.methods||[]);
  const learned={};learnEffects(series).forEach(e=>{if(e.n>=3)learned[e.t]=e.avg});
  const hyper=(p.goals||[]).includes('Body composition / making weight')||['bodybuilding'].includes(p.sport)||(p.positions||[]).some(x=>/Powerlifting|Strongman/.test(x));
  const ok=it=>(!it.eq||eq.has(it.eq))&&!(it.avoid||[]).some(a=>activeInj.includes(a));
  const score=it=>{let s=0;it.reg.forEach(r=>{const f=regions.find(x=>x.k===r);if(f)s+=f.v});if(it.reg.includes('*'))s+=3;if(prefs.has(it.tag))s+=2;s+=(learned[it.tag]||0)*.4;return s};
  const used=new Set();
  const pick=(kinds,n,extra=()=>true)=>{
    const c=LIB.filter(it=>kinds.includes(it.kind)&&ok(it)&&!used.has(it.id)&&extra(it)).sort((a,b)=>score(b)-score(a)).slice(0,n);
    c.forEach(x=>used.add(x.id));return c;
  };
  const byId=id=>LIB.find(x=>x.id===id);
  const sessions=[];const notes=[];
  // Daily routines first so they stay the same from day to day
  used.add('box');used.add('sigh');used.add('legsup');
  const morning=[byId('box'),...pick(['dyn','act'],5,it=>!it.eq)];
  const nightStretch=pick(['static'],5,it=>!it.eq);
  // Day-specific session
  let mid=null;
  if(dt==='competition'){
    mid={id:'post',t:'Post-competition reset',when:'Within 60 min of the final whistle',items:[...pick(['flush'],1),...pick(['soft'],2,it=>it.id!=='therapist'),...pick(['mod'],1,it=>it.tag==='cold'||it.tag==='compression')]};
    notes.push({c:'',t:'Competition day: keep the morning routine dynamic and save long static holds for tonight.'});
  }else if(dt==='training'||dt==='pre'){
    const mods=pick(['mod'],1,it=>{if(hyper&&it.id==='plunge')return false;return it.tag!=='heat'});
    mid={id:'post',t:dt==='pre'?'Sharpen & unload':'Post-training recovery',when:'After your session',items:[...pick(['soft'],2,it=>it.id!=='therapist'),...pick(['static'],dt==='pre'?0:1),...mods]};
    if(hyper&&eq.has('plunge'))notes.push({c:'',t:'Cold plunge is left out after lifting days. Cold water within about 4 hours of strength work can blunt muscle gain.'});
  }else{
    mid={id:'active',t:dt==='post'?'Post-game flush':'Active recovery',when:'Late morning',items:[...pick(['flush'],1),...pick(['soft'],2),...pick(['static'],1),...pick(['mod'],1,it=>it.tag==='compression'||it.tag==='cold')]};
  }
  const heat=pick(['mod'],1,it=>it.tag==='heat'&&!(dt==='pre'&&it.id==='sauna'));
  sessions.push({id:'am',t:'Morning stretch',when:'Every morning, right after you wake up',daily:true,items:morning});
  if(mid&&mid.items.length)sessions.push(mid);
  sessions.push({id:'pm',t:'Night stretch',when:'Every night, 30–60 min before bed',daily:true,items:[...heat,...nightStretch,byId('legsup'),...(zone==='bad'||dt==='post'?[byId('nsdr')]:[byId('sigh')])]});
  if(activeInj.length){notes.push({c:'warn',t:`Modified around your active ${activeInj.map(a=>INJ.find(x=>x.k===a)?.n.toLowerCase()).join(' and ')} injury. Movements that load it were removed. Follow your medical team's plan first.`})}
  if(activeInj.includes('concussion'))notes.push({c:'bad',t:'Concussion: heat and cold exposure are paused. Follow your graded return-to-play protocol and get medical clearance before hard training.'});
  sessions.forEach(s=>s.min=s.items.reduce((a,b)=>a+b.min,0));
  return{dt,zone,focus,sessions,notes};
}

function trainingCall(p,t,dt){
  if(t.recovery==null){
    const b={competition:'Competition day. Check in so your warm-up and fueling advice match how you feel.',pre:'Competition tomorrow. Keep today short and sharp, and protect tonight\'s sleep.',post:'Day after competition: flush, eat and sleep. Hard work waits until tomorrow.',training:'Check in to see how hard you should push in today\'s session.',rest:'Recovery day. Easy movement, good food, early night.'}[dt];
    return{head:'How did you wake up?',body:b,c:'warn'};
  }
  const z=zoneOf(t.recovery);const acwr=t.acwr;
  let head,body,c=z;
  if(dt==='competition'){head=z==='bad'?'Compete, but manage your warm-up':'Ready to compete';body=z==='bad'?'You\'re under-recovered. Extend the warm-up by 5–10 minutes, front-load fluids and electrolytes, and build intensity gradually.':'Stick to your routine. Prime early, eat 3–4 hours out, and keep the morning light.';}
  else if(z==='good'){head='Cleared for high intensity';body='You slept well and your body feels good. This is the day to push speed, power or volume.';}
  else if(z==='warn'){head='Train, with a ceiling';body='Train as planned but cap the hardest efforts around RPE 7 and trim volume about 20%. Quality over quantity.';}
  else{head='Recovery comes first today';body='Your body is asking for a break. Keep it technical at RPE 5 or lower, or swap the session for active recovery. Tell your coach or trainer if this keeps happening.';}
  if(acwr>1.5){body+=` Your training load jumped this week (ratio ${acwr.toFixed(2)}). Spikes above 1.5 raise soft-tissue injury risk.`;if(c==='good')c='warn'}
  if(dt==='pre')body+=' Competition tomorrow: keep volume low and sharp, and protect tonight\'s sleep.';
  if(dt==='post')body+=' Day after competition: flush, eat and sleep.';
  return{head,body,c};
}
function hydrationPlan(p,t){
  const kg=p.weightKg||75;
  const sweat=p.sweatRate||[.6,.8,1.0,1.2,1.4][p.intensity??2];
  const base=kg*35;
  const sess=t.sess&&!t.est?t.sess:(t.planned.min?{min:t.planned.min}:null);
  const tmin=sess?sess.min:0;
  const train=Math.round(sweat*tmin/60*1000);
  return{base:Math.round(base),train,total:Math.round((base+train)/50)*50,sweat,tmin,sodium:Math.round(sweat*tmin/60*900),pre:Math.round(kg*6)};
}
function tonight(p,t){
  const c=sleepCfg(p),need=sleepNeed(p);
  const load=t.sess&&!t.est?t.load:t.planned.min*t.planned.rpe;
  const loadAdd=c.loadAdj?clamp((load-300)/600*.5,0,.75):0,debtAdd=c.debtAdj?clamp(t.debt/7*.5,0,.75):0;
  const hrs=need+loadAdd+debtAdd,tom=addDays(new Date(),1),wake=parseT(wakeFor(p,tom));
  return{need,loadAdd,debtAdd,hrs,wake,tom,latency:c.latency,bedBy:wake-hrs*60-c.latency};
}

function ruleBrief(p,t,plan,hp,tn){
  const out=[];const c=t.checkin;
  if(c){
    const why=[];if(t.sleepPerf<85)why.push(`sleep covered ${t.sleepPerf}% of your need`);if(c.soreness>=4)why.push('you\'re carrying soreness');if(c.energy<=2)why.push('energy is low');if(c.stress>=4)why.push('stress is high');if(t.penalty>3)why.push('recent training load is high');
    out.push([`${zoneName(t.recovery)} at ${t.recovery}`,why.length?`Holding you back: ${why.join(', ')}.`:'Sleep, body and mind all line up today.']);
  }
  out.push([`Focus areas: ${plan.focus.slice(0,3).map(f=>REGION_N[f].toLowerCase()).join(', ')}`,`Picked for ${(p.sport==='other'?p.otherSport:SPORTS[p.sport]?.n||'').toLowerCase()}${p.positions?.length?` (${p.positions.join(', ').toLowerCase()})`:''}${c?.sore?.length?' and the spots you flagged this morning':''}.`]);
  out.push([`Drink ${volStr(hp.total)} today`,hp.tmin?`${volStr(hp.base)} baseline plus ${volStr(hp.train)} to replace about ${hp.tmin} minutes of sweat. Add about ${hp.sodium} mg of sodium around the session.`:'Baseline for your body weight on a day without a session.']);
  out.push([`Lights out by ${fmtT(tn.bedBy)}`,`Your sleep target tonight is ${fmtH(tn.hrs)}.`]);
  return out;
}

/* ============================== BOTTLES ============================== */
const defaultBottles=()=>metric()?[250,500,750,1000]:[237,473,710,946];
const bottlesOf=p=>(p.bottles&&p.bottles.length?p.bottles:defaultBottles()).slice().sort((a,b)=>a-b);
const ozOf=ml=>ml/29.574;
/* Draws a container whose size matches its volume. All share one scale so a 32 oz bottle is visibly 4× an 8 oz cup. */
function bottleSVG(ml,i,small){
  const vol=ozOf(ml);const W=60,BOT=118;
  const scale=Math.sqrt(clamp(vol,4,80)/40);
  let shape,inner,fillTop,top;
  if(vol<=12){ // cup
    const h=96*scale*1.05,wt=h*.82,wb=wt*.72;top=BOT-h;
    shape=`M${30-wt/2} ${top} L${30-wb/2} ${BOT} L${30+wb/2} ${BOT} L${30+wt/2} ${top}`;
    inner=`M${30-wt/2+2} ${top+h*.12} L${30-wb/2+2} ${BOT-2} L${30+wb/2-2} ${BOT-2} L${30+wt/2-2} ${top+h*.12}Z`;fillTop=top+h*.12;
  }else{ // bottle
    const h=108*scale,w=clamp(h*.44,14,44),sh=BOT-h*.74,nk=w*.48;top=BOT-h;
    shape=`M${30-nk/2} ${top+h*.1} L${30-nk/2} ${sh-w*.25} Q${30-w/2} ${sh-w*.1} ${30-w/2} ${sh+w*.2} L${30-w/2} ${BOT-5} Q${30-w/2} ${BOT} ${30-w/2+5} ${BOT} L${30+w/2-5} ${BOT} Q${30+w/2} ${BOT} ${30+w/2} ${BOT-5} L${30+w/2} ${sh+w*.2} Q${30+w/2} ${sh-w*.1} ${30+nk/2} ${sh-w*.25} L${30+nk/2} ${top+h*.1}Z`;
    inner=`M${30-w/2+2} ${sh+w*.15} L${30-w/2+2} ${BOT-3} Q${30-w/2+2} ${BOT-2} ${30-w/2+6} ${BOT-2} L${30+w/2-6} ${BOT-2} Q${30+w/2-2} ${BOT-2} ${30+w/2-2} ${BOT-3} L${30+w/2-2} ${sh+w*.15}Z`;fillTop=sh+w*.15;
    shape+=`<rect x="${30-nk/2-1.5}" y="${top}" width="${nk+3}" height="${h*.1+1}" rx="2" fill="var(--faint)"/>`;
    shape=`<path d="${shape.split('<rect')[0]}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round"/>`+'<rect'+shape.split('<rect')[1];
  }
  if(vol<=12)shape=`<path d="${shape}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 ${W} 120" aria-hidden="true" class="${small?'bsm':''}"><path class="bwater" d="${inner}" fill="var(--accent)" opacity=".85"/>${shape}</svg>`;
}
function bottleBtns(p,{small=false,max=99}={}){
  const pour=UI.pour&&Date.now()-UI.pour.at<1200?UI.pour.ml:null;
  return `<div class="bottles ${small?'small':''}">${bottlesOf(p).slice(0,max).map((ml,i)=>`<button class="bottle ${pour===ml?'pour':''}" data-act="water" data-v="${ml}" aria-label="Log ${volStr(ml)}">${bottleSVG(ml,i,small)}<span class="mono">+${volStr(ml)}</span></button>`).join('')}</div>`;
}

function sweatResult(){
  const w=UI.sw;const k=metric()?1:.4536,ml=metric()?1:29.574;
  if(!w.pre||!w.post||!w.min)return'';
  const lossKg=(w.pre-w.post)*k,drank=(w.drank||0)*ml/1000;
  const rate=(lossKg+drank)/(w.min/60);w.rate=rate;
  const pct=lossKg/(w.pre*k)*100;
  return `<b>${rate.toFixed(2)} L/h</b> sweat rate. You lost ${pct.toFixed(1)}% of body weight${pct>2?', past the 2% point where performance drops. Drink more during sessions.':'.'}`;
}

  switch(OB_STEPS[step]){
    case'about':return d.name.trim()&&+d.age>=10&&+d.age<=80&&+d.heightCm>100&&+d.weightKg>30;
    case'sport':return!!d.sport&&(d.sport!=='other'||d.otherSport.trim());
    case'level':return!!d.level;
    case'training':return d.practiceDays.length>0;
    default:return true;
  }
}
function renderOnboarding(){
  if(!UI.ob)UI.ob=newDraft();
  const d=UI.ob,step=UI.obStep,name=OB_STEPS[step];

    const imp=!metric();const inch=d.heightCm?Math.round(d.heightCm/2.54):'';

  }else if(name==='sport'){
    html=`<div><div class="eyebrow">Step 2 · Sport</div><h1 style="margin-top:10px">What do you compete in?</h1><p class="lead">Your sport decides which joints and tissues take the most stress, and where your recovery work goes.</p></div>

  }else if(name==='training'){
    html=`<div><div class="eyebrow">Step 5 · Training</div><h1 style="margin-top:10px">How do you train?</h1><p class="lead">This builds your planned workload so recovery is ready before you log a single session.</p></div>
     <div class="grid g2"><div class="field"><span class="flabel">Sessions per week</span><span class="rangeval" id="v-freq">${d.freq}</span><input type="range" min="1" max="14" value="${d.freq}" data-f="freq" id="ob-freq" aria-label="Sessions per week"></div>

     <div class="field" style="max-width:320px"><label for="ob-next">Next competition (optional)</label><input class="input" id="ob-next" type="date" data-f="nextComp" value="${esc(d.nextComp)}"></div>`;
  }else if(name==='sleep'){
    const win=((parseT(d.wake)-parseT(d.bed)+1440)%1440)/60;const need=sleepNeed({age:+d.age});
    html=`<div><div class="eyebrow">Step 7 · Sleep</div><h1 style="margin-top:10px">Your usual sleep schedule.</h1><p class="lead">Sleep is the largest driver of recovery. We'll plan your bedtime around your wake time and the load you carry.</p></div>
     <div class="grid g2"><div class="field"><label for="ob-bed">Usual bedtime</label><input class="input" type="time" id="ob-bed" data-f="bed" value="${d.bed}"></div><div class="field"><label for="ob-wake">Usual wake time</label><input class="input" type="time" id="ob-wake" data-f="wake" value="${d.wake}"></div></div>
     <div class="note ${win<need-.5?'warn':''}" id="sleepnote">That's a ${fmtH(win)} window. At ${d.age||'your age'}, athletes need about ${fmtH(need)} of actual sleep${win<need?', so you start most nights short.':'.'}</div>`;
  }else if(name==='body'){
    html=`<div><div class="eyebrow">Step 8 · Body</div><h1 style="margin-top:10px">Injuries and limitations.</h1><p class="lead">Active injuries are protected and worked around. Past ones become focus areas.</p></div>
     <div class="ob-section"><span class="flabel">Current or past injuries</span><div class="chips">${INJ.map(i=>`<button data-act="inj" data-v="${i.k}" aria-pressed="${d.injuries.some(x=>x.area===i.k)}">${i.n}</button>`).join('')}</div>
      ${d.injuries.map(x=>`<div class="injrow"><b>${INJ.find(i=>i.k===x.area).n}</b><div class="seg">${INJ_STATUS.map(([k,n])=>`<button data-act="injst" data-a="${x.area}" data-v="${k}" aria-pressed="${x.status===k}">${n}</button>`).join('')}</div></div>`).join('')}</div>
     <div class="ob-section"><span class="flabel">Mobility limitations</span><div class="chips">${MOBILITY.map(([n])=>`<button data-act="multi" data-f="mobility" data-v="${esc(n)}" ${pressed(d.mobility,n)}>${n}</button>`).join('')}</div></div>`;
  }else if(name==='recovery'){
    html=`<div><div class="eyebrow">Step 9 · Recovery</div><h1 style="margin-top:10px">How you like to recover.</h1><p class="lead">Your goals and toolkit. Morrow only prescribes what you can actually do.</p></div>
     <div class="ob-section"><span class="flabel">Goals <span class="muted">(pick up to 3)</span></span><div class="chips">${GOALS.map(n=>`<button data-act="multi" data-f="goals" data-v="${esc(n)}" data-max="3" ${pressed(d.goals,n)}>${n}</button>`).join('')}</div></div>
     <div class="ob-section"><span class="flabel">Preferred methods</span><div class="chips">${METHODS.map(([k,n])=>`<button data-act="multi" data-f="methods" data-v="${k}" ${pressed(d.methods,k)}>${n}</button>`).join('')}</div></div>
     <div class="ob-section"><span class="flabel">Equipment you can access</span><div class="chips">${EQUIP.map(([k,n])=>`<button data-act="multi" data-f="equipment" data-v="${k}" ${pressed(d.equipment,k)}>${n}</button>`).join('')}</div></div>`;
  }else if(name==='done'){
    const p=finalizeDraft(d);const f=focusRegions(p).slice(0,4);const s=SPORTS[p.sport];
    html=`<div><div class="eyebrow">Ready</div><h1 style="margin-top:10px">Your recovery system is built, ${esc(p.name.split(' ')[0])}.</h1><p class="lead">Here's what Morrow will plan around. It sharpens with every check-in and every protocol you complete.</p></div>
     <div class="panel"><div class="list">
      <div class="row"><div class="body"><div class="t">${esc(p.sport==='other'?p.otherSport:s.n)}${p.positions.length?' · '+esc(p.positions.join(', ')):''}</div><div class="s">${LEVELS.find(l=>l.k===p.level)?.n} · ${p.phase} · ${p.freq} sessions/week</div></div></div>
      <div class="row"><div class="body"><div class="t">Focus areas</div><div class="s">${f.map(x=>REGION_N[x.k]).join(', ')}</div></div></div>
      <div class="row"><div class="body"><div class="t">Sleep target</div><div class="s">${fmtH(sleepNeed(p))} a night, waking ${fmtT(parseT(p.wake))}</div></div></div>
      <div class="row"><div class="body"><div class="t">Daily fluid baseline</div><div class="s">${volStr(p.weightKg*35)} plus sweat losses on training days</div></div></div>
      ${p.injuries.filter(i=>i.status==='active').length?`<div class="row"><div class="body"><div class="t">Protected</div><div class="s">${p.injuries.filter(i=>i.status==='active').map(i=>INJ.find(x=>x.k===i.area).n).join(', ')}</div></div></div>`:''}
     </div></div>`;
  }
  const last=name==='done';
  return `<div class="ob"><div class="ob-top"><span class="mark"></span><div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="mono small muted">${step}/${OB_STEPS.length-1}</span></div>
   <div class="ob-body">${html}</div>
   <div class="ob-foot"><button class="btn ghost" data-act="obback">${UI.editing?'Cancel':'Back'}</button><button class="btn primary" data-act="${last?'obfinish':'obnext'}" id="obnext" ${obValid(step)?'':'disabled'}>${last?'Open my dashboard':UI.editing&&name!=='sport'?'Save':name==='position'&&!UI.ob.positions.length?'Skip':'Continue'}</button></div></div>`;
}
function renderWelcome(){
  return `<div class="ob"><div class="welcome">
   <div><div class="brand" style="padding:0;margin-bottom:36px"><span class="mark"></span><b>MORROW</b></div>
    <h1>Recover like it's part of the job.</h1>
    <p class="lead">A 30-second morning check-in plus your training load. Morrow turns it into a recovery score and writes the day's plan for your sport, your position and your body. No watch or ring needed.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="obnext">Build my profile</button><button class="btn ghost" data-act="sample">Preview with a sample athlete</button></div>

   </div>

    <div style="display:flex;justify-content:center">${ring(81,200,14)}</div>
    <div class="vitals" style="margin-top:0"><div class="vital"><div class="eyebrow">Sleep</div><span class="num" style="font-size:22px">8:24</span></div><div class="vital"><div class="eyebrow">Soreness</div><span class="num" style="font-size:22px">Light</span></div><div class="vital"><div class="eyebrow">Energy</div><span class="num" style="font-size:22px">Great</span></div><div class="vital"><div class="eyebrow">Load</div><span class="num" style="font-size:22px">1.08</span></div></div>
   </div></div></div>`;
}
function finalizeDraft(d){return{...d,name:d.name.trim(),age:+d.age,heightCm:+d.heightCm,weightKg:+d.weightKg,sex:d.sex||'na',level:d.level||'rec',freq:+d.freq,duration:+d.duration,positions:d.positions.filter(Boolean)}}
function afterOb(){requestAnimationFrame(()=>document.querySelectorAll('.ring-arc[data-off]').forEach(el=>el.style.strokeDashoffset=el.dataset.off))}
function refreshNext(){const b=$('#obnext');if(b&&b.dataset.act==='obnext')b.disabled=!obValid(UI.obStep)}

function samplePlayer(){
  const p={sample:true,name:'Jordan Ellis',age:26,sex:'male',heightCm:188,weightKg:93,sport:'football',otherSport:'',positions:['Wide receiver'],level:'pro',freq:6,duration:120,intensity:3,practiceDays:[0,1,2,3,4],practiceTime:'Morning',phase:'In-season',compDays:[6],nextComp:'',bed:'22:45',wake:'06:30',injuries:[{area:'hamstring',status:'managing'},{area:'ankle',status:'past'}],mobility:['Tight hip flexors','Limited ankle dorsiflexion'],goals:['Stay injury-free','Manage in-season fatigue','Improve sleep quality'],methods:['cold','compression','soft','mobility'],equipment:['foam','ball','gun','bands','plunge','sauna','boots','pool','therapist']};
  const days={};const today=new Date();
  for(let i=1;i<=12;i++){const k=keyOf(addDays(today,-i));const r=rng(hash('s'+k));const pool=['frquad','plunge','boots','9090','box','legsup','sauna','ktw','contrast','nsdr'];const done=pool.filter(()=>r()<.45);const lift=done.filter(x=>['boots','plunge','legsup','nsdr'].includes(x)).length;
    days[k]={done,water:Math.round(2800+r()*1800),checkin:{sleepH:Math.round((6.4+r()*2.2)*4)/4,quality:clamp(Math.round(2+r()*3),1,5),soreness:clamp(Math.round(1.5+r()*3-lift*.3),1,5),energy:clamp(Math.round(2+r()*3),1,5),stress:clamp(Math.round(1+r()*3),1,5),sore:[]}}}
  days[keyOf(today)]={water:1180,done:['box'],checkin:{sleepH:7.75,quality:4,soreness:3,energy:4,stress:2,sore:['hamstrings']}};
  return{p,days};
}

/* ============================== EVENTS ============================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='scrim'&&e.target!==el)return;
  const d=UI.ob;
  switch(a){
    case'tab':UI.tab=v;try{localStorage.setItem('morrow.tab',v)}catch(_){}render();window.scrollTo({top:0});break;
    case'obnext':if(UI.editing&&OB_STEPS[UI.obStep]!=='sport'){S.profile={...finalizeDraft(UI.ob)};UI.editing=false;UI.ob=null;UI.obStep=0;persist();render();toast('Profile updated');break}if(UI.obStep===0){UI.ob=UI.ob||newDraft()}UI.obStep=Math.min(OB_STEPS.length-1,UI.obStep+1);render();window.scrollTo({top:0});break;
    case'obback':if(UI.editing){UI.editing=false;S.profile=UI.editing0;render();break}UI.obStep=Math.max(0,UI.obStep-1);render();break;
    case'obfinish':{const p=finalizeDraft(UI.ob);if(UI.editing){S.profile={...p}}else{S.profile=p;S.days=S.days||{}}UI.editing=false;UI.ob=null;UI.obStep=0;UI.tab='today';persist();render();window.scrollTo({top:0});break}
    case'obset':{let val=v;if(el.dataset.f==='intensity')val=+v;d[el.dataset.f]=val;render();break}
    case'sport':if(d.sport!==v){d.positions=[]}d.sport=v;render();break;
    case'pos':{const s=SPORTS[d.sport];if(s.multi){d.positions=d.positions.includes(v)?d.positions.filter(x=>x!==v):[...d.positions,v]}else d.positions=d.positions[0]===v?[]:[v];render();break}
    case'day':{const f=el.dataset.f,n=+v;d[f]=d[f].includes(n)?d[f].filter(x=>x!==n):[...d[f],n].sort();render();break}
    case'multi':{const f=el.dataset.f,max=+el.dataset.max||99;if(d[f].includes(v))d[f]=d[f].filter(x=>x!==v);else if(d[f].length<max)d[f]=[...d[f],v];render();break}
    case'inj':{if(d.injuries.some(x=>x.area===v))d.injuries=d.injuries.filter(x=>x.area!==v);else d.injuries=[...d.injuries,{area:v,status:'active'}];render();break}
    case'injst':{const x=d.injuries.find(i=>i.area===el.dataset.a);if(x)x.status=v;render();break}
    case'units':S.units=v;if(S.profile)persist();else{try{localStorage.setItem(LSK,JSON.stringify(S))}catch(_){}}render();break;
    case'sample':{const {p,days}=samplePlayer();S={profile:p,days,units:S.units,updatedAt:0};UI.tab='today';render();break}
    case'restart':S={profile:null,days:{},units:S.units,updatedAt:0};UI.ob=newDraft();UI.obStep=1;UI.chat=[];UI.brief=null;render();break;
    case'editstep':UI.editing=true;UI.editing0=S.profile;UI.ob=JSON.parse(JSON.stringify({...newDraft(),...S.profile}));UI.obStep=+v;S.profile=null;render();window.scrollTo({top:0});break;
    case'askreset':UI.confirmReset=true;render();break;
    case'cancelreset':UI.confirmReset=false;render();break;
    case'doreset':UI.confirmReset=false;S={profile:null,days:{},units:S.units,updatedAt:Date.now()};try{localStorage.removeItem(LSK)}catch(_){}if(store.mode==='cloud')store.chain=store.chain.then(()=>store.ref.delete()).catch(()=>{});UI.ob=null;UI.obStep=0;UI.chat=[];UI.brief=null;render();break;
    case'sheet':openSheet(v);break;
    case'close':case'scrim':UI.sheet=null;render();break;
    case'ck':readCk();UI.ck[el.dataset.f]=+v;render();break;
    case'cksore':{readCk();const a=UI.ck.sore||[];UI.ck.sore=a.includes(v)?a.filter(x=>x!==v):[...a,v];render();break}
    case'saveck':{readCk();const c=UI.ck;const day=dayLog();day.checkin={...c,at:Date.now()};UI.sheet=null;UI.brief=null;persist();toast('Recovery updated');UI.tab='today';break}
    case'savesess':{readSess();const day=dayLog();day.session={min:UI.sess.min,rpe:UI.sess.rpe};UI.sheet=null;persist();toast('Session logged');break}
    case'savesweat':{readSweat();if(UI.sw.rate&&UI.sw.rate>0.1&&UI.sw.rate<4){S.profile.sweatRate=+UI.sw.rate.toFixed(2);UI.sheet=null;persist();toast('Sweat rate saved')}break}
    case'water':{const day=dayLog();const ml=+v;day.water=(day.water||0)+ml;day.wlog=[...(day.wlog||[]),ml].slice(-40);UI.pour={ml,at:Date.now()};persist();render();clearTimeout(UI.pourT);UI.pourT=setTimeout(()=>{UI.pour=null;render()},1250);break}
    case'wundo':{const day=dayLog();const l=day.wlog||[];if(l.length){day.water=Math.max(0,(day.water||0)-l.pop());day.wlog=l;persist();render()}break}
    case'badd':{addBottle(+v);break}
    case'bdel':{S.profile.bottles=bottlesOf(S.profile).filter(x=>x!==+v);persist();render();break}
    case'nap':{const day=dayLog();day.nap=+v?(day.nap||0)+ +v:0;persist();render();break}
    case'wind':{const day=dayLog();const w=day.wind||[];day.wind=w.includes(v)?w.filter(x=>x!==v):[...w,v];persist();render();break}
    case'scfg':{let val=v;if(v==='true')val=true;else if(v==='false')val=false;setSleep({[el.dataset.k]:val});break}
    case'rtoggle':{const r=JSON.parse(JSON.stringify(sleepCfg(S.profile).routine));r[+el.dataset.i].on=!r[+el.dataset.i].on;setSleep({routine:r});break}
    case'rdel':{const r=sleepCfg(S.profile).routine.filter((_,i)=>i!==+el.dataset.i);setSleep({routine:r});break}
    case'rreset':setSleep({routine:DEFAULT_ROUTINE});toast('Default steps restored');break;
    case'done':{const day=dayLog();day.done=day.done||[];day.done=day.done.includes(v)?day.done.filter(x=>x!==v):[...day.done,v];persist();render();break}
    case'timer':toggleTimer(v,+el.dataset.min);break;
    case'demo':UI.demo=v;UI.sheet='demo';render();break;
    case'brief':writeBrief();break;
    case'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case'installhide':try{localStorage.setItem('morrow.installHidden','1')}catch(_){}render();toast('Steps are saved in Profile');break;
    case'copylink':{const inp=$('#applink');const done=()=>{el.textContent='Copied';setTimeout(()=>{el.textContent='Copy link'},1600)};
      try{navigator.clipboard.writeText(APP_URL).then(done,()=>{inp.select();el.textContent='Press Ctrl/⌘+C'})}catch(_){inp.select();el.textContent='Press Ctrl/⌘+C'}break}
  }
});
function setSleep(o){S.profile.sleep={...sleepCfg(S.profile),...o};persist();render()}
function addBottle(ml){if(!(ml>=50&&ml<=2500)){toast('Enter a size between '+(metric()?'50 and 2500 ml':'2 and 84 oz'));return}const b=bottlesOf(S.profile);if(b.some(x=>Math.abs(x-ml)<5))return;if(b.length>=6){toast('Up to 6 bottles. Remove one first.');return}S.profile.bottles=[...b,Math.round(ml)];persist();render()}
document.addEventListener('change',e=>{
  const el=e.target;if(!S.profile||UI.ob)return;
  const k=el.dataset.scfg;
  if(k){const v=el.value;if(!v)return;
    if(k==='wake'){S.profile.wake=v;const c=sleepCfg(S.profile);setSleep({wakeDays:c.wakeMode==='same'?Array(7).fill(v):c.wakeDays});return}
    if(k==='wakeDay'){const d=[...sleepCfg(S.profile).wakeDays];d[+el.dataset.i]=v;setSleep({wakeDays:d});return}
    setSleep({[k]:['goalH','latency','temp'].includes(k)?+v:v});return}
  if(el.dataset.rbefore!=null){const r=JSON.parse(JSON.stringify(sleepCfg(S.profile).routine));r[+el.dataset.rbefore].before=+el.value;setSleep({routine:r})}
});
document.addEventListener('input',e=>{
  {const el=e.target;if(el.dataset&&el.dataset.lbl){const o=document.getElementById(el.dataset.lbl);const v=+el.value;if(o)o.textContent=el.dataset.fmt==='h'?fmtH(v):el.dataset.fmt==='m'?v+' min':tempStr(v)}}
  const el=e.target;
  if(UI.ob&&el.dataset.f){
    const d=UI.ob,f=el.dataset.f,v=el.value;
    if(f==='ft'||f==='in'){const ft=+$('#ob-ft').value||0,inch=+$('#ob-in').value||0;d.heightCm=(ft*12+inch)*2.54||''}
    else if(f==='lb')d.weightKg=v?+v/2.2046:'';
    else if(f==='cm')d.heightCm=v?+v:'';
    else if(f==='kg')d.weightKg=v?+v:'';
    else if(f==='posfree')d.positions=v.trim()?[v]:[];
    else if(f==='freq'||f==='duration'){d[f]=+v;const o=$('#v-'+f);if(o)o.textContent=f==='duration'?v+' min':v}
    else d[f]=v;
    if(f==='bed'||f==='wake'){const n=$('#sleepnote');if(n){const win=((parseT(d.wake)-parseT(d.bed)+1440)%1440)/60,need=sleepNeed({age:+d.age});n.textContent=`That's a ${fmtH(win)} window. At ${d.age||'your age'}, athletes need about ${fmtH(need)} of actual sleep${win<need?', so you start most nights short.':'.'}`;n.className='note '+(win<need-.5?'warn':'')}}
    refreshNext();return;
  }
  if(el.id==='ck-sleep'){readCk();$('#ck-sleepv').textContent=fmtH(UI.ck.sleepH)}
  if(el.id==='ss-rpe'||el.id==='ss-min'){readSess();$('#ss-rpev').textContent=UI.sess.rpe;$('#ss-load').textContent=`${UI.sess.min*UI.sess.rpe} AU load`}
  if(el.id?.startsWith('sw-')){readSweat();$('#sw-out').innerHTML=sweatResult()||'Enter your numbers to see your sweat rate.'}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='addstep'){e.preventDefault();const tx=$('#ns-text').value.trim();if(!tx)return;const r=[...sleepCfg(S.profile).routine,{id:'c'+Date.now().toString(36),text:tx,before:+$('#ns-before').value,on:true,custom:true}];setSleep({routine:r});return}
  if(e.target.id==='addbottle'){e.preventDefault();const v=+$('#nb-size').value;if(v)addBottle(metric()?v:v*29.574);return}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.sheet){UI.sheet=null;render()}
  if(e.key==='Enter'&&UI.ob&&e.target.matches('.ob input')){const b=$('#obnext');if(b&&!b.disabled)b.click()}
});
function dayLog(){const k=todayKey();return S.days[k]=S.days[k]||{}}
function openSheet(k){
  const day=S.days[todayKey()]||{};
  if(k==='checkin')UI.ck={sleepH:Math.round(usualSleep(S.profile)*4)/4,quality:3,soreness:3,energy:3,stress:2,sore:[],...JSON.parse(JSON.stringify(day.checkin||{}))};
  if(k==='session'){const pl=plannedLoad(S.profile,new Date());UI.sess=day.session?{...day.session}:{min:pl.min||S.profile.duration||60,rpe:Math.round(pl.rpe||6)}}
  if(k==='sweat')UI.sw={min:60};
  UI.sheet=k;render();
}
function readCk(){const v=$('#ck-sleep')?.value;if(v)UI.ck.sleepH=+v}
function readSess(){UI.sess.min=+$('#ss-min').value||0;UI.sess.rpe=+$('#ss-rpe').value}
function readSweat(){['pre','post','drank','min'].forEach(f=>{const v=$('#sw-'+f).value;UI.sw[f]=v===''?'':+v})}
function toggleTimer(id,min){
  const t=UI.timers[id];
  if(t){clearInterval(t.iv);delete UI.timers[id];render();return}
  const tm={left:min*60};tm.iv=setInterval(()=>{tm.left--;document.querySelectorAll('[data-tm="'+id+'"]').forEach(b=>b.textContent=fmtClock(Math.max(0,tm.left)));
    if(tm.left<=0){clearInterval(tm.iv);delete UI.timers[id];const day=dayLog();day.done=day.done||[];if(!day.done.includes(id))day.done.push(id);persist();toast('Done. Nice work.')}},1000);
  UI.timers[id]=tm;render();
}

render();
requestAnimationFrame(figLoop);
initCloud();
</script>
